{% extends "base.html" %}
{% block content %}
<a href="{{ url_for('views.lesson_plans') }}">&larr; {{ t('back', lang) }}</a>
<h1>{{ plan.title }}</h1>
<p class="muted">{{ t('subject', lang) }}: {{ plan.subject or '' }} &middot; {{ t('grade', lang) }}: {{ plan.grade or '' }}</p>
<div class="panel"><div class="pre">{{ plan.content }}</div></div>
{% endblock %}
