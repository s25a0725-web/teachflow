{% extends "base.html" %}
{% block content %}
<div class="panel auth-card">
  <div class="auth-logo"><img src="{{ url_for('views.branding_logo') }}" alt="{{ brand_name }}"></div>
  <h1>{{ t('forgot_title', lang) }}</h1>
  <p class="muted">{{ t('forgot_hint', lang) }}</p>
  <form method="post">
    <label>{{ t('email', lang) }}</label>
    <input type="email" name="email" required autofocus>
    <button type="submit">{{ t('forgot_continue', lang) }}</button>
  </form>
  <p><a href="{{ url_for('auth.login') }}">{{ t('back_to_login', lang) }}</a></p>
</div>
{% endblock %}
