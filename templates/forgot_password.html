{% extends "base.html" %}
{% block content %}
<div class="panel auth-card">
  <div class="auth-logo"><img src="{{ url_for('views.branding_logo') }}" alt="{{ brand_name }}"></div>
  <h1>{{ t('forgot_title', lang) }}</h1>
  <p class="muted auth-subtitle">{{ t('forgot_hint', lang) }}</p>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ t('email', lang) }}</label>
    <input type="email" name="email" required autofocus autocomplete="email">
    <button type="submit" class="auth-submit">{{ t('forgot_continue', lang) }}</button>
  </form>
  <div class="auth-links">
    <a href="{{ url_for('auth.login') }}">{{ t('back_to_login', lang) }}</a>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='auth.js') }}"></script>
{% endblock %}
