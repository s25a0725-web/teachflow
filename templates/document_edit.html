{% extends "base.html" %}
{% block content %}
<a href="{{ url_for('documents.document_view', did=doc.id) }}">&larr; {{ t('back', lang) }}</a>
<h1>{{ t('doc_edit_title', lang) }}: {{ doc.title }}</h1>
<p class="muted">{{ t('doc_edit_hint', lang) }}</p>

{% if text %}
<form method="post">
  <textarea name="text" rows="22" style="font-family:monospace">{{ text }}</textarea>
  <button type="submit">{{ t('doc_edit_save', lang) }}</button>
</form>
{% else %}
<div class="flash flash-error">{{ t('doc_no_text', lang) }}</div>
{% endif %}
{% endblock %}
