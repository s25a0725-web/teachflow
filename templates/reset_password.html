{% extends "base.html" %}
{% block content %}
<div class="panel auth-card">
  <div class="auth-logo"><img src="{{ url_for('views.branding_logo') }}" alt="{{ brand_name }}"></div>
  <h1>{{ t('reset_answer_question', lang) }}</h1>
  <p class="muted">{{ t(question, lang) }}</p>
  <form method="post">
    <label>{{ t('security_answer', lang) }}</label>
    <input type="text" name="answer" required autofocus autocomplete="off">
    <label>{{ t('new_password', lang) }}</label>
    <input type="password" name="password" required minlength="6">
    <button type="submit">{{ t('reset_submit', lang) }}</button>
  </form>
  <p><a href="{{ url_for('auth.login') }}">{{ t('back_to_login', lang) }}</a></p>
</div>
{% endblock %}
